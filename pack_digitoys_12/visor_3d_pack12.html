<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D - Pack DigiToys 12 (70 mm x 10 mm)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121316;
            color: #e5e7eb;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 320px;
            background-color: #1a1c22;
            border-right: 1px solid #2d3139;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .header {
            padding: 20px;
            background-color: #21242b;
            border-bottom: 1px solid #2d3139;
        }
        .header h1 {
            font-size: 1.15rem;
            color: #00d2be;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 0.8rem;
            color: #9ca3af;
        }
        #list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .item-btn {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 8px;
            background: #252830;
            border: 1px solid #323640;
            border-radius: 8px;
            color: #d1d5db;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .item-btn:hover {
            background: #2d323d;
            border-color: #00d2be;
            color: #fff;
        }
        .item-btn.active {
            background: rgba(0, 210, 190, 0.15);
            border-color: #00d2be;
            color: #00d2be;
            font-weight: 600;
        }
        .badge {
            font-size: 0.7rem;
            background: #374151;
            padding: 2px 6px;
            border-radius: 4px;
            color: #9ca3af;
        }
        .item-btn.active .badge {
            background: #00d2be;
            color: #111;
        }
        #viewport-container {
            flex: 1;
            position: relative;
        }
        #viewport {
            width: 100%;
            height: 100%;
        }
        #controls-bar {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
            background: rgba(26, 28, 34, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #2d3139;
        }
        .ctrl-btn {
            background: #252830;
            border: 1px solid #374151;
            color: #e5e7eb;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ctrl-btn:hover {
            border-color: #00d2be;
            color: #00d2be;
        }
        #stats-overlay {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(26, 28, 34, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #2d3139;
            font-size: 0.82rem;
            line-height: 1.5;
        }
        #stats-overlay span {
            color: #00d2be;
            font-weight: 600;
        }
        #drop-zone {
            position: absolute;
            inset: 0;
            display: none;
            background: rgba(0, 210, 190, 0.15);
            border: 3px dashed #00d2be;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: #00d2be;
        }
    </style>
    <!-- Three.js + STLLoader + OrbitControls from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
</head>
<body>
    <div id="sidebar">
        <div class="header">
            <h1>Pack DigiToys (12 STLs)</h1>
            <p>Altura: 70 mm &bull; Grosor: 10 mm &bull; Doble Boleado Simétrico: 1.2 mm</p>
        </div>
        <div id="list"></div>
    </div>
    <div id="viewport-container">
        <div id="viewport"></div>
        <div id="controls-bar">
            <button class="ctrl-btn" id="btn-wireframe">Wireframe</button>
            <button class="ctrl-btn" id="btn-reset">Reiniciar Vista</button>
            <button class="ctrl-btn" id="btn-color">Color</button>
        </div>
        <div id="stats-overlay">
            <div>Modelo: <span id="stat-name">-</span></div>
            <div>Dimensiones: <span id="stat-dims">-</span></div>
            <div>Volumen: <span id="stat-vol">-</span></div>
            <div>Impresión: <span id="stat-print">Echado (Doble boleado simétrico)</span></div>
        </div>
        <div id="drop-zone">Suelta archivo STL aquí</div>
    </div>

    <script>
        const models = [
            { name: "01_dino_bebe_1", file: "02_modelos_stl_10mm/01_dino_bebe_1.stl", dims: "75.5 × 70.0 × 10.0 mm", vol: "28.4 cm³" },
            { name: "02_dino_bebe_2", file: "02_modelos_stl_10mm/02_dino_bebe_2.stl", dims: "69.5 × 70.0 × 10.0 mm", vol: "27.2 cm³" },
            { name: "03_fantasmita", file: "02_modelos_stl_10mm/03_fantasmita.stl", dims: "75.9 × 70.0 × 10.0 mm", vol: "37.2 cm³" },
            { name: "04_frijolito", file: "02_modelos_stl_10mm/04_frijolito.stl", dims: "70.7 × 70.0 × 10.0 mm", vol: "37.5 cm³" },
            { name: "05_monstruo_cuernitos", file: "02_modelos_stl_10mm/05_monstruo_cuernitos.stl", dims: "56.6 × 70.0 × 10.0 mm", vol: "26.3 cm³" },
            { name: "06_mostrito_orejon", file: "02_modelos_stl_10mm/06_mostrito_orejon.stl", dims: "62.6 × 70.0 × 10.0 mm", vol: "29.7 cm³" },
            { name: "07_monstruo_espinoso", file: "02_modelos_stl_10mm/07_monstruo_espinoso.stl", dims: "65.3 × 70.0 × 10.0 mm", vol: "31.9 cm³" },
            { name: "08_mostrito_periscopio", file: "02_modelos_stl_10mm/08_mostrito_periscopio.stl", dims: "60.0 × 70.0 × 10.0 mm", vol: "25.8 cm³" },
            { name: "09_marciano_zog", file: "02_modelos_stl_10mm/09_marciano_zog.stl", dims: "44.2 × 70.0 × 10.0 mm", vol: "19.9 cm³" },
            { name: "10_monstruo_crestas", file: "02_modelos_stl_10mm/10_monstruo_crestas.stl", dims: "73.6 × 70.0 × 10.0 mm", vol: "32.6 cm³" },
            { name: "11_robot_bip_bop", file: "02_modelos_stl_10mm/11_robot_bip_bop.stl", dims: "55.0 × 70.0 × 10.0 mm", vol: "21.1 cm³" },
            { name: "12_gato_miau", file: "02_modelos_stl_10mm/12_gato_miau.stl", dims: "68.6 × 70.0 × 10.0 mm", vol: "29.9 cm³" }
        ];

        // Three.js setup
        const container = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x121316);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1000);
        camera.position.set(0, -90, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 5);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight1.position.set(80, 100, 120);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x00d2be, 0.45);
        dirLight2.position.set(-80, -60, 40);
        scene.add(dirLight2);

        // Grid (Build plate)
        const gridHelper = new THREE.GridHelper(160, 16, 0x00d2be, 0x2d3139);
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);

        const colors = [0x00d2be, 0xffaa00, 0xec4899, 0x8b5cf6, 0x3b82f6, 0x10b981];
        let colorIdx = 0;

        const material = new THREE.MeshStandardMaterial({
            color: colors[colorIdx],
            roughness: 0.25,
            metalness: 0.1,
            flatShading: false
        });

        let currentMesh = null;
        const loader = new THREE.STLLoader();

        function loadModel(idx) {
            const m = models[idx];
            document.querySelectorAll('.item-btn').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });

            document.getElementById('stat-name').innerText = m.name;
            document.getElementById('stat-dims').innerText = m.dims;
            document.getElementById('stat-vol').innerText = m.vol;

            loader.load(m.file, function (geometry) {
                geometry.computeVertexNormals();
                if (currentMesh) scene.remove(currentMesh);

                currentMesh = new THREE.Mesh(geometry, material);
                scene.add(currentMesh);
            }, undefined, function (error) {
                console.error("Error loading STL:", error);
            });
        }

        // Build sidebar list
        const listEl = document.getElementById('list');
        models.forEach((m, idx) => {
            const btn = document.createElement('button');
            btn.className = 'item-btn' + (idx === 0 ? ' active' : '');
            btn.innerHTML = `<span>${m.name}</span><span class="badge">STL</span>`;
            btn.onclick = () => loadModel(idx);
            listEl.appendChild(btn);
        });

        // Initial load
        loadModel(0);

        // Controls
        document.getElementById('btn-wireframe').onclick = () => {
            material.wireframe = !material.wireframe;
        };

        document.getElementById('btn-reset').onclick = () => {
            camera.position.set(0, -90, 100);
            controls.target.set(0, 0, 5);
            controls.update();
        };

        document.getElementById('btn-color').onclick = () => {
            colorIdx = (colorIdx + 1) % colors.length;
            material.color.setHex(colors[colorIdx]);
        };

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
